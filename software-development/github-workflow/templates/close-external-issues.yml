name: Close Issues from External Users

on:
  issues:
    types: [opened]

jobs:
  close-external-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check if issue author is a member
        uses: actions/github-script@v7
        with:
          script: |
            const issueAuthor = context.payload.issue.user.login;
            try {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: issueAuthor,
              });
              const level = permission.permission;
              if (level !== 'admin' && level !== 'write') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `👋 Hello @${issueAuthor}!\n\nIssue creation in this repository is restricted to organization members. We welcome your input via comments on existing issues!`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  state: 'closed',
                  state_reason: 'not_planned',
                });
              }
            } catch (e) {
              console.log('Error checking permissions: ' + e.message);
            }
